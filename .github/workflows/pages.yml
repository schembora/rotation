name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Download airports
        run: |
          mkdir -p data
          curl -sSfL -o data/airports.csv https://davidmegginson.github.io/ourairports-data/airports.csv

      # web/index.html is authored without a doctype (the Claude artifact host
      # wraps it); add one here so browsers render in standards mode.
      - name: Build site
        run: |
          mkdir -p dist
          { printf '<!doctype html>\n<html lang="en">\n'; cat web/index.html; } > dist/index.html
          cargo run --release -- export data/airports.csv samples/rotation.json dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
