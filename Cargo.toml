[package]
name = "daily"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tzf-rs = { version = "2.1.3", default-features = false, features = ["bundled"] }

# The bundled time-zone finder is slow to initialise unoptimised.
[profile.dev.package.tzf-rs]
opt-level = 3
